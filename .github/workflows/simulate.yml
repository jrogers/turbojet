name: Simulate

# Runs the deterministic simulator (crates/turbojet-sim) on random seeds for a while each night,
# FIX sessions and FIXP sessions in jobs of their own, beyond the fixed seeds every push runs; and
# the soak (crates/turbojet-interop/tests/soak.rs), the real engine through a fault proxy, over TCP
# and TLS, one acceptor or a replicated pair. Run it by hand for a longer or shorter session.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of random seeds
        default: "1800"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: fix
            flag: ""
          - protocol: fixp
            flag: "--fixp"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Stops at the first failure, printing its seed. `shell: bash` sets pipefail, so a failure
      # survives the tee.
      - name: Random seeds
        shell: bash
        run: scripts/sim.sh ${{ inputs.seconds || 1800 }} ${{ matrix.flag }} | tee sim.log
      # The failing seed's whole trace, to read or replay locally (scripts/sim.sh 0 <seed> -v, with
      # --fixp for FIXP).
      - name: Trace the failure
        if: failure()
        shell: bash
        run: |
          seed=$(grep -oE '^seed [0-9]+ failed' sim.log | head -1 | cut -d' ' -f2)
          if [ -n "$seed" ]; then scripts/sim.sh 0 "$seed" -v ${{ matrix.flag }} > "trace-$seed.txt" || true; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: simulation-trace-${{ matrix.protocol }}
          path: |
            sim.log
            trace-*.txt

  # Turbojet against itself through a proxy that cuts, blackholes, stalls, holds and slows the link,
  # each process crashing now and then: ten minutes of faults over TCP, then over TLS, one at a time
  # so that neither slows the other's heartbeats.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Soak
        run: cargo test -p turbojet-interop --release --test soak soak_over -- --nocapture --test-threads=1
        env:
          TURBOJET_SOAK: "600"

  # The same with a replicated acceptor: an active and its standby over a real link, the active
  # crashing or cut off and an operator promoting the standby, the link cut, stalled or slowed.
  soak-replicated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Soak
        run: cargo test -p turbojet-interop --release --test soak soak_replicated -- --nocapture --test-threads=1
        env:
          TURBOJET_SOAK: "600"

  # Opens an issue when a scheduled run fails (or comments on the open one), and closes it when one
  # passes, so a failure doesn't go unnoticed for days. Manual runs are watched by whoever ran them.
  report:
    needs: [simulate, soak, soak-replicated]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # Failed if either job failed; a cancelled one says nothing either way.
      - run: scripts/nightly-report.sh "${{ github.workflow }}" "$RESULT" "$URL"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

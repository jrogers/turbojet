name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy and tests for each feature combination, since feature-gated code only builds when enabled.
  # The turbojet-codegen command's tests run rustfmt. The simulator's seeds run the same whatever
  # the engine's features, so they run once, with all of them.
  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: --no-default-features
            skip: --exclude=turbojet-sim
          - features: --features tls
            skip: --exclude=turbojet-sim
          - features: --features metrics
            skip: --exclude=turbojet-sim
          - features: --features tz
            skip: --exclude=turbojet-sim
          - features: --all-features
            skip: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} --locked -- -D warnings
      - run: cargo test --workspace ${{ matrix.skip }} ${{ matrix.features }} --locked

  # The minimum supported Rust version (workspace rust-version).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  # The SQL stores (crates/turbojet-sql) on PostgreSQL, whose tests are skipped without a database;
  # the jobs above test them on SQLite. A PostgreSQL-only build too, which the matrix doesn't cover.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: turbojet
          POSTGRES_PASSWORD: turbojet
          POSTGRES_DB: turbojet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbojet"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TURBOJET_POSTGRES_URL: postgres://turbojet:turbojet@localhost:5432/turbojet_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p turbojet-sql --all-targets --no-default-features --features postgres --locked -- -D warnings
      - run: cargo test -p turbojet-sql --all-features --locked

  # Turbojet against QuickFIX/J (crates/turbojet-interop), in both roles.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            crates/turbojet-interop/peer/*.gradle.kts
            crates/turbojet-interop/peer/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/interop.sh

  # Generated version crates must match the dictionaries and the generator.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/codegen.sh
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  # Rustdoc warnings, including broken intra-doc links, are errors.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps --locked

  # The fuzz targets (crates/turbojet/fuzz) still build against the current API. They're outside the
  # workspace, so the jobs above don't see them; fuzzing itself runs nightly (fuzz.yml).
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/turbojet/fuzz
      - run: cargo fmt --manifest-path crates/turbojet/fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/turbojet/fuzz/Cargo.toml --all-targets --locked -- -D warnings

  # Dependency licences, security advisories and sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Compile the benchmarks without running them.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --all-features --no-run --locked

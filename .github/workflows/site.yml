name: Site

# Builds the website (scripts/site.sh: the landing page, and the guide and architecture overview
# as a book) and deploys it to GitHub Pages. Runs when a release is tagged, so the site documents
# what's on crates.io; run it by hand from a tag to redeploy that release's site.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer release's waits rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,mdbook-mermaid@0.17.1
      # Links to files outside the book point at this release's tag on GitHub.
      - run: scripts/site.sh "${{ github.ref_name }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

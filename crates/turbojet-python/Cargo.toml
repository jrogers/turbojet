[package]
name = "turbojet-python"
description = "Python bindings for Turbojet: FIX initiators driven from asyncio"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/jrogers/turbojet"
publish = false

# Kept out of the main workspace: built with maturin, and cargo test can't link libpython.
[workspace]
members = ["."]

[lib]
name = "_turbojet"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["sync", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbojet = { path = "../turbojet" }
turbojet-config = { path = "../turbojet-config" }

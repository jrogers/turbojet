[package]
name = "turbojet-replica"
description = "Replicated session state for Turbojet: a hot standby that takes over FIX sessions with no gap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fix", "trading", "finance", "replication", "failover"]
categories = ["finance", "network-programming"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
turbojet.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# The link over TLS: serve_standby_tls, and TcpLink::with_tls.
tls = ["turbojet/tls"]

[dev-dependencies]
criterion.workspace = true
rcgen.workspace = true
tempfile.workspace = true
turbojet = { workspace = true, features = ["conformance"] }

# Benchmarks use criterion; keep the libtest bench harness out of `cargo bench`.
[lib]
bench = false

[[test]]
name = "tls"
required-features = ["tls"]

[[bench]]
name = "replica"
harness = false

[lints]
workspace = true

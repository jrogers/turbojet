[package]
name = "turbojet-interop"
description = "Interoperability tests: Turbojet sessions against QuickFIX/J and QuickFIX/n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
p12-keystore.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
turbojet = { workspace = true, features = ["tls", "pkcs12"] }

[dev-dependencies]
# The replicated soak: an active and its standby, over a lease in SQLite.
turbojet-replica = { workspace = true, features = ["tls"] }
turbojet-sql = { path = "../turbojet-sql", features = ["replica"] }

[lints]
workspace = true

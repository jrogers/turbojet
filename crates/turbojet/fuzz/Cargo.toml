[package]
name = "turbojet-fuzz"
description = "cargo-fuzz targets for Turbojet's codec, message and session parsing"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Kept out of the main workspace: fuzzing needs nightly and cargo fuzz.
[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
# The operator's sequence commands reply on a oneshot channel.
tokio = { version = "1", features = ["sync"] }
turbojet = { path = ".." }
turbojet-fix = { path = "../../turbojet-fix", features = ["fix40", "fix41", "fix42", "fix43", "fix44", "fix50", "fix50sp1", "fix50sp2"] }
turbojet-fast = { path = "../../turbojet-fast" }

# Symbols in stack traces.
[profile.release]
debug = 1

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed"
path = "fuzz_targets/typed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sbe_decode"
path = "fuzz_targets/sbe_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fixp_session"
path = "fuzz_targets/fixp_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fast_decode"
path = "fuzz_targets/fast_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fast_templates"
path = "fuzz_targets/fast_templates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fast_round_trip"
path = "fuzz_targets/fast_round_trip.rs"
test = false
doc = false
bench = false

[package]
name = "turbojet-fix"
description = "FIX 4.0 to 5.0 SP2 application messages for Turbojet, generated from the official FIX data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fix", "trading", "finance", "protocol"]
categories = ["network-programming", "finance"]

[features]
# One per FIX version; none by default, so a build compiles only the versions it uses.
fix40 = []
fix41 = []
fix42 = []
fix43 = []
fix44 = []
fix50 = []
fix50sp1 = []
fix50sp2 = []

# The library has no unit tests or benchmarks. Without these, `--all-targets`, `cargo test` and
# `cargo bench` compile all its versions a second time, at the same time, doubling the memory
# they need (about 7 GB for each with every version).
[lib]
test = false
bench = false

[dependencies]
turbojet.workspace = true

[package.metadata.docs.rs]
all-features = true

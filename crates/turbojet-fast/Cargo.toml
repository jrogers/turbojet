[package]
name = "turbojet-fast"
description = "FAST (FIX Adapted for STreaming) 1.1 for Turbojet: messages decoded and encoded with templates loaded at runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fix", "fast", "trading", "finance", "market-data"]
categories = ["encoding", "finance"]

[dependencies]
roxmltree.workspace = true
turbojet.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
# Another implementation, to check decoding against (tests/fastlib.rs).
fastlib = { version = "0.3", default-features = false }
turbojet-fix44.workspace = true

# Benchmarks use criterion; keep the libtest bench harness out of `cargo bench`.
[lib]
bench = false

[[bench]]
name = "fast"
harness = false

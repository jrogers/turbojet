[workspace]
members = ["crates/*"]
# Version 3 makes dependency resolution honour rust-version (prefers compatible releases).
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
# File::try_lock (DiskStorage session locking) was stabilised in 1.89.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/jrogers/turbojet"

# Benchmarks build as one optimisation unit with fat LTO. With the default 16 codegen units,
# inlining depends on how code happens to be partitioned, so unrelated edits can shift results by
# 5-10% and masquerade as regressions. Only `cargo bench` uses this profile.
[profile.bench]
codegen-units = 1
lto = "fat"

# Lints behind STYLE.md, for the crates that opt in with `[lints] workspace = true` (all but the
# generated turbojet-fix* crates, whose code is macro invocations).
[workspace.lints.rust]
# Deny rather than forbid, so a reviewed exception can `#[allow]` it locally with a reason.
unsafe_code = "deny"
# Public types can go in a user's `#[derive(Debug)]` struct.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# A builder's result dropped (`msg.with(tag, value);`) is a bug.
return_self_not_must_use = "warn"
# Public functions that return a Result say when they fail.
missing_errors_doc = "warn"
# Thresholds are in clippy.toml.
too_many_lines = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
compact_str = { version = "0.10", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# Compressing finished message log files (turbojet's `gzip` feature), without C code.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
metrics = "0.24"
# Only the HTTP /metrics listener: the default push-gateway client pulls in aws-lc-rs.
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
rcgen = "0.14"
roxmltree = "0.21"
# The SQL stores (turbojet-sql). 0.8, as 0.9 needs Rust 1.94; backends are its features.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
# Session configuration files (turbojet-config).
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
x509-parser = { version = "0.18", default-features = false }
p12-keystore = "=0.3.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# Parses generated docs as rustdoc does, in turbojet-codegen's tests.
pulldown-cmark = { version = "0.13", default-features = false }
turbojet = { version = "0.2.0", path = "crates/turbojet" }
turbojet-dictionary = { version = "0.2.0", path = "crates/turbojet-dictionary" }
# Path only: turbojet dev-depends on it, and a version would force it onto crates.io first.
turbojet-config = { path = "crates/turbojet-config" }
turbojet-fix42 = { path = "crates/turbojet-fix42" }
turbojet-fix43 = { path = "crates/turbojet-fix43" }
turbojet-fix44 = { path = "crates/turbojet-fix44" }
turbojet-fix50sp2 = { path = "crates/turbojet-fix50sp2" }

\* The design as built: synchronous, not degrading, an expiring lease checked after acquiring,
\* whole sends held until their last part, a standby checked before it promotes, and a standby
\* that may lose its store. specs/check.sh Replication KEY=VALUE overrides a constant.
CONSTANTS
  Nodes = {a, b}
  None = None
  Lag = 0
  Degrade = FALSE
  Fencing = TRUE
  CheckFirst = FALSE
  Skew = FALSE
  Chunked = FALSE
  HoldWhole = TRUE
  LosesStore = TRUE
  StandbyCrashes = FALSE
  Checks = TRUE
  PlantUnchecked = FALSE
  MaxSeq = 2
  MaxSeq2 = 2
  MaxEpoch = 2
  MaxMsg = 1
  MaxBatches = 5
  MaxConn = 2
  MaxInc = 4
SPECIFICATION Spec
INVARIANTS NoSeqReuse NoSeqReuse2 ResendsMatch PromotableCovers PromotableCovers2
